{% extends "base.html" %}

{% block title %}Register Athlete &bull; Athlete Performance &amp; Fatigue Analytics{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" x2="19" y1="8" y2="14"/>
          <line x1="22" x2="16" y1="11" y2="11"/>
        </svg>
      </div>
      <h1 class="auth-title">Create Athlete Account</h1>
      <p class="auth-subtitle">Set up your profile to start logging session telemetry and track recovery indices.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="full_name">
          <span>Full Name</span>
          <span class="label-optional">Required</span>
        </label>
        <div class="input-with-icon">
          <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Alex Morgan" value="{{ full_name or '' }}" required autofocus autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">
          <span>Email Address</span>
          <span class="label-optional">Required</span>
        </label>
        <div class="input-with-icon">
          <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="email" name="email" class="form-control" placeholder="athlete@gmail.com" value="{{ email or '' }}" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          <span>Password</span>
          <span class="label-optional">Min. 8 characters</span>
        </label>
        <div class="input-with-icon">
          <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required minlength="8" autocomplete="new-password">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">
          <span>Confirm Password</span>
        </label>
        <div class="input-with-icon">
          <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••••••" required minlength="8" autocomplete="new-password">
        </div>
      </div>

      <div class="auth-row-options">
        <label class="checkbox-container">
          <input type="checkbox" id="show_pwd" onclick="togglePasswordVisibility()">
          <span class="checkbox-label">Show Passwords</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Continue to Athlete Details
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </form>

    <div class="auth-footer-nav">
      <span>Already have an account?</span>
      <a href="{{ url_for('login') }}" class="auth-link">Sign in here</a>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility() {
  const p1 = document.getElementById("password");
  const p2 = document.getElementById("confirm_password");
  const type = p1.type === "password" ? "text" : "password";
  p1.type = type;
  p2.type = type;
}
</script>
{% endblock %}
